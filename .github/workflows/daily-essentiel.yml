name: Générer et publier L'Essentiel

# ---------------------------------------------------------------------------
# DÉCLENCHEMENT
#
# 1. Automatiquement lorsque data/daily-data.json est mis à jour sur main
# 2. Manuellement depuis l'onglet Actions de GitHub
# ---------------------------------------------------------------------------

on:
  push:
    branches:
      - main
    paths:
      - 'data/daily-data.json'

  workflow_dispatch:

# Évite deux générations simultanées de L'Essentiel.
concurrency:
  group: essentiel-production
  cancel-in-progress: false

# Le workflow doit pouvoir écrire la nouvelle édition dans le dépôt.
permissions:
  contents: write


jobs:

  generate-check-publish:

    name: Rédaction → Contrôle → Publication

    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------------------
      # 1. RÉCUPÉRER LE DÉPÔT
      # ---------------------------------------------------------------------

      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ---------------------------------------------------------------------
      # 2. INSTALLER NODE.JS
      # ---------------------------------------------------------------------

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      # ---------------------------------------------------------------------
      # 3. INSTALLER LES DÉPENDANCES
      # ---------------------------------------------------------------------

      - name: Installer les dépendances
        run: npm install


      # ---------------------------------------------------------------------
      # 4. OPENAI RÉDIGE L'ESSENTIEL
      #
      # OpenAI est le rédacteur automatique principal.
      # Claude, Grok et Copilot ne sont PAS appelés.
      # ---------------------------------------------------------------------

      - name: Rédiger L'Essentiel avec OpenAI
        env:
          AI_PROVIDER: chatgpt
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        run: |
          echo ""
          echo "=========================================="
          echo "✍️  RÉDACTION DE L'ESSENTIEL — OPENAI"
          echo "=========================================="
          node scripts/generate-essentiel.mjs


      # ---------------------------------------------------------------------
      # 5. GEMINI CONTRÔLE LE CONTENU
      #
      # Gemini ne réécrit pas l'article.
      # Il sert de contrôleur qualité indépendant.
      #
      # PASS → workflow continue
      # FAIL → workflow s'arrête, aucune publication
      # ---------------------------------------------------------------------

      - name: Contrôler L'Essentiel avec Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |
          echo ""
          echo "=========================================="
          echo "🔎 CONTRÔLE QUALITÉ — GEMINI"
          echo "=========================================="
          node scripts/qa-essentiel.mjs


      # ---------------------------------------------------------------------
      # 6. CONTRÔLE TECHNIQUE ASTRO
      #
      # Même si Gemini donne PASS, on vérifie que le nouveau contenu
      # ne casse pas le site.
      # ---------------------------------------------------------------------

      - name: Vérifier la compilation du site
        run: |
          echo ""
          echo "=========================================="
          echo "🧪 TEST DE COMPILATION DU SITE"
          echo "=========================================="
          npm run build


      # ---------------------------------------------------------------------
      # 7. VÉRIFIER LES MODIFICATIONS
      # ---------------------------------------------------------------------

      - name: Vérifier qu'une nouvelle édition a été générée
        id: changes
        run: |
          git add src/pages/essentiel.astro

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Aucune modification détectée dans essentiel.astro."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ Une nouvelle édition a été générée."
          fi


      # ---------------------------------------------------------------------
      # 8. COMMIT ET PUBLICATION SUR MAIN
      #
      # Cette étape n'est exécutée que :
      # - si OpenAI a réussi ;
      # - si Gemini a donné PASS ;
      # - si npm run build a réussi ;
      # - si essentiel.astro a réellement changé.
      #
      # Vercel détectera ensuite le commit sur main.
      # ---------------------------------------------------------------------

      - name: Publier L'Essentiel sur GitHub
        if: steps.changes.outputs.changed == 'true'

        run: |
          git config user.name "ECONOZONE Automation"
          git config user.email "actions@github.com"

          git commit -m "Publication automatique de L'Essentiel"
          git push origin main


      # ---------------------------------------------------------------------
      # 9. CONFIRMATION
      # ---------------------------------------------------------------------

      - name: Confirmer la publication
        if: steps.changes.outputs.changed == 'true'

        run: |
          echo ""
          echo "=========================================="
          echo "✅ PUBLICATION AUTORISÉE"
          echo "=========================================="
          echo "OpenAI        : rédaction réussie"
          echo "Gemini        : contrôle qualité réussi"
          echo "Astro         : compilation réussie"
          echo "GitHub        : nouvelle édition enregistrée"
          echo "Vercel        : déploiement attendu automatiquement"
          echo "=========================================="


      # ---------------------------------------------------------------------
      # 10. CAS OÙ AUCUNE MODIFICATION N'EST NÉCESSAIRE
      # ---------------------------------------------------------------------

      - name: Aucune publication nécessaire
        if: steps.changes.outputs.changed == 'false'

        run: |
          echo "ℹ️ Le contenu généré est identique au contenu déjà publié."
          echo "Aucun nouveau commit n'a été créé."
