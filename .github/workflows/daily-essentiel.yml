name: Générer L'Essentiel du jour

# Se déclenche automatiquement quand vous mettez à jour data/daily-data.json,
# ou manuellement depuis l'onglet "Actions" de GitHub — avec le choix du fournisseur IA.
on:
  push:
    paths:
      - 'data/daily-data.json'
  workflow_dispatch:
    inputs:
      ai_provider:
        description: 'Fournisseur IA à utiliser'
        required: true
        default: 'claude'
        type: choice
        options:
          - claude
          - chatgpt
          - gemini
          - grok
          - copilot

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        run: npm install

      - name: Générer le contenu via l'IA choisie
        env:
          AI_PROVIDER: ${{ github.event.inputs.ai_provider || 'claude' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          # Optionnel — voir README : présent = Copilot natif (facturation Copilot),
          # absent = Copilot en mode BYOK via ANTHROPIC_API_KEY (aucun coût Copilot).
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: node scripts/generate-essentiel.mjs

      - name: Ouvrir une Pull Request pour relecture
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Essentiel du jour — généré automatiquement (${{ github.event.inputs.ai_provider || 'claude' }})"
          title: "L'Essentiel — édition à relire avant publication"
          body: |
            Cette page a été générée automatiquement à partir de `data/daily-data.json`,
            via le fournisseur **${{ github.event.inputs.ai_provider || 'claude' }}**.

            **Avant de fusionner (Merge) :**
            - [ ] Vérifier les chiffres cités
            - [ ] Compléter la "Note de la rédaction"
            - [ ] Remplacer chaque `<!-- PHOTO: ... -->` par une vraie image (recherche manuelle, droits respectés)
            - [ ] Ouvrir le lien d'aperçu Vercel ci-dessous pour voir le rendu réel

            Rien n'est publié sur le site tant que cette PR n'est pas fusionnée.
          branch: essentiel-du-jour
          delete-branch: true
