name: Générer et publier L'Essentiel et Matières premières

# ---------------------------------------------------------------------------
# DÉCLENCHEMENT
#
# 1. Automatiquement lorsque data/daily-data.json est mis à jour sur main
# 2. Manuellement depuis l'onglet Actions de GitHub
# ---------------------------------------------------------------------------

on:
  push:
    branches:
      - main
    paths:
      - 'data/daily-data.json'

  workflow_dispatch:

# Évite deux générations simultanées.
concurrency:
  group: econozone-production
  cancel-in-progress: false

# Le workflow doit pouvoir écrire les nouvelles éditions dans le dépôt.
permissions:
  contents: write


jobs:

  generate-check-publish:

    name: Rédaction → Contrôle → Publication

    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------------------
      # 1. RÉCUPÉRER LE DÉPÔT
      # ---------------------------------------------------------------------

      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ---------------------------------------------------------------------
      # 2. INSTALLER NODE.JS
      #
      # Astro demande désormais Node.js >= 22.12.
      # Node.js 24 est utilisé pour éviter les avertissements de dépréciation.
      # ---------------------------------------------------------------------

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'


      # ---------------------------------------------------------------------
      # 3. INSTALLER LES DÉPENDANCES
      # ---------------------------------------------------------------------

      - name: Installer les dépendances
        run: npm ci


      # =====================================================================
      # L'ESSENTIEL
      # =====================================================================

      # ---------------------------------------------------------------------
      # 4. OPENAI RÉDIGE L'ESSENTIEL
      # ---------------------------------------------------------------------

      - name: Rédiger L'Essentiel avec OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        run: |
          echo ""
          echo "=========================================="
          echo "✍️  RÉDACTION DE L'ESSENTIEL — OPENAI"
          echo "=========================================="

          node scripts/generate-essentiel.mjs


      # ---------------------------------------------------------------------
      # 5. GEMINI CONTRÔLE L'ESSENTIEL
      #
      # PASS → le workflow continue
      # FAIL → aucune publication
      # ---------------------------------------------------------------------

      - name: Contrôler L'Essentiel avec Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |
          echo ""
          echo "=========================================="
          echo "🔎 CONTRÔLE QUALITÉ — L'ESSENTIEL"
          echo "=========================================="

          node scripts/qa-essentiel.mjs


      # =====================================================================
      # MATIÈRES PREMIÈRES
      # =====================================================================

      # ---------------------------------------------------------------------
      # 6. OPENAI MET À JOUR LA ZONE DYNAMIQUE MATIÈRES PREMIÈRES
      # ---------------------------------------------------------------------

      - name: Rédiger Matières premières avec OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        run: |
          echo ""
          echo "=========================================="
          echo "✍️  RÉDACTION MATIÈRES PREMIÈRES — OPENAI"
          echo "=========================================="

          node scripts/generate-commodities.mjs


      # ---------------------------------------------------------------------
      # 7. GEMINI CONTRÔLE MATIÈRES PREMIÈRES
      # ---------------------------------------------------------------------

      - name: Contrôler Matières premières avec Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |
          echo ""
          echo "=========================================="
          echo "🔎 CONTRÔLE QUALITÉ — MATIÈRES PREMIÈRES"
          echo "=========================================="

          node scripts/qa-commodities.mjs


      # =====================================================================
      # TEST TECHNIQUE DU SITE
      # =====================================================================

      # ---------------------------------------------------------------------
      # 8. VÉRIFIER QUE LE SITE ASTRO COMPILE
      #
      # Si la génération IA produit du HTML/Astro invalide,
      # le workflow s'arrête ici avant toute publication.
      # ---------------------------------------------------------------------

      - name: Vérifier la compilation du site
        run: |
          echo ""
          echo "=========================================="
          echo "🧪 TEST DE COMPILATION DU SITE"
          echo "=========================================="

          npm run build


      # =====================================================================
      # VÉRIFICATION DES MODIFICATIONS
      # =====================================================================

      # ---------------------------------------------------------------------
      # 9. VÉRIFIER SI UNE NOUVELLE ÉDITION EXISTE
      # ---------------------------------------------------------------------

      - name: Vérifier qu'une nouvelle édition a été générée
        id: changes

        run: |
          git add \
            src/pages/essentiel.astro \
            src/pages/matieres-premieres.astro

          if git diff --cached --quiet; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo ""
            echo "ℹ️ Aucune modification détectée."
            echo "→ Aucun commit ne sera créé."

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo ""
            echo "✅ Une nouvelle édition a été générée."

            echo ""
            echo "Fichiers modifiés :"
            git diff --cached --name-only

          fi


      # =====================================================================
      # PUBLICATION
      # =====================================================================

      # ---------------------------------------------------------------------
      # 10. COMMIT SUR MAIN
      #
      # Cette étape n'est exécutée que si :
      #
      # - OpenAI a réussi pour L'Essentiel ;
      # - Gemini a validé L'Essentiel ;
      # - OpenAI a réussi pour Matières premières ;
      # - Gemini a validé Matières premières ;
      # - Astro compile correctement ;
      # - au moins une page a réellement changé.
      #
      # Vercel détectera ensuite automatiquement le commit sur main.
      # ---------------------------------------------------------------------

      - name: Publier sur GitHub
        if: steps.changes.outputs.changed == 'true'

        run: |
          git config user.name "ECONOZONE Automation"
          git config user.email "actions@github.com"

          git commit -m "Publication automatique ECONOZONE"

          git push origin main


      # ---------------------------------------------------------------------
      # 11. CONFIRMATION
      # ---------------------------------------------------------------------

      - name: Confirmer la publication
        if: steps.changes.outputs.changed == 'true'

        run: |
          echo ""
          echo "=========================================="
          echo "✅ PUBLICATION AUTORISÉE"
          echo "=========================================="

          echo "✅ OpenAI — rédaction L'Essentiel"
          echo "✅ Gemini — contrôle L'Essentiel"
          echo "✅ OpenAI — rédaction Matières premières"
          echo "✅ Gemini — contrôle Matières premières"
          echo "✅ Astro — compilation du site"
          echo "✅ GitHub — commit sur main"
          echo "✅ Vercel — déploiement attendu automatiquement"

          echo ""
          echo "ECONOZONE peut maintenant être mis à jour."

          echo "=========================================="


      # ---------------------------------------------------------------------
      # 12. CAS OÙ RIEN N'A CHANGÉ
      # ---------------------------------------------------------------------

      - name: Aucune publication nécessaire
        if: steps.changes.outputs.changed == 'false'

        run: |
          echo ""
          echo "=========================================="
          echo "ℹ️ AUCUNE PUBLICATION NÉCESSAIRE"
          echo "=========================================="

          echo "Les contrôles ont réussi,"
          echo "mais aucune différence n'a été détectée"
          echo "dans les pages générées."

          echo "Aucun nouveau commit n'a été créé."

          echo "=========================================="
